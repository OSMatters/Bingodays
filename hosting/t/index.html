<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open template - Bingodays</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4efe9;
        color: #3b2411;
      }
      .card {
        max-width: 560px;
        margin: 48px auto 0;
        padding: 24px;
        border-radius: 18px;
        background: #fff8f1;
        border: 1px solid #ead7c2;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }
      p {
        margin: 0 0 12px;
        line-height: 1.5;
      }
      .row {
        display: flex;
        gap: 12px;
        margin-top: 16px;
      }
      .btn {
        display: inline-block;
        text-decoration: none;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid #d2ae89;
        color: #3b2411;
        font-weight: 600;
      }
      .btn.primary {
        background: #3b2411;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Open in Bingodays</h1>
      <p id="subtitle">If Bingodays is installed, this template will open in the app.</p>
      <div class="row">
        <a class="btn primary" id="openAppBtn" href="#">Open app</a>
        <a class="btn" href="https://apps.apple.com/app/id6760203837">Get Bingodays</a>
      </div>
    </div>

    <script>
      (function () {
        const appStoreURL = "https://apps.apple.com/app/id6760203837";
        const openAppBtn = document.getElementById("openAppBtn");
        const subtitle = document.getElementById("subtitle");

        function findPayloadInText(text) {
          if (!text) return null;
          const match = text.match(/payload=([A-Za-z0-9_-]+)/);
          return match ? match[1] : null;
        }

        function extractPayload() {
          const url = new URL(window.location.href);

          // Normal case: /t?payload=...
          const queryPayload = url.searchParams.get("payload");
          if (queryPayload) return queryPayload;

          // Compat case: /t#payload=...
          if (url.hash) {
            const hash = url.hash.replace(/^#/, "");
            const hashParams = new URLSearchParams(hash);
            const hashPayload = hashParams.get("payload");
            if (hashPayload) return hashPayload;
          }

          // Compat case: /t/<payload>
          const pathParts = url.pathname.split("/").filter(Boolean);
          const tIndex = pathParts.lastIndexOf("t");
          if (tIndex >= 0 && tIndex + 1 < pathParts.length) {
            const pathPayload = pathParts[tIndex + 1];
            if (pathPayload) return pathPayload;
          }

          // Fallback: payload embedded in nested query values.
          for (const value of url.searchParams.values()) {
            try {
              const decoded = decodeURIComponent(value);
              const nestedPayload = findPayloadInText(decoded) || findPayloadInText(value);
              if (nestedPayload) return nestedPayload;
            } catch (_) {
              const nestedPayload = findPayloadInText(value);
              if (nestedPayload) return nestedPayload;
            }
          }

          // Last resort: search entire URL string.
          return findPayloadInText(window.location.href);
        }

        const payload = extractPayload();
        if (!payload) {
          subtitle.textContent = "Template link is invalid. You can install Bingodays from the App Store.";
          openAppBtn.href = appStoreURL;
          openAppBtn.textContent = "Open App Store";
          return;
        }

        const nativeDeepLink = `bingodays://template?payload=${encodeURIComponent(payload)}`;
        openAppBtn.href = nativeDeepLink;

        // Try to open app immediately when browser allows it.
        window.location.href = nativeDeepLink;

        // Fallback to App Store for not-installed users.
        setTimeout(function () {
          if (document.visibilityState === "visible") {
            window.location.replace(appStoreURL);
          }
        }, 1400);
      })();
    </script>
  </body>
</html>
